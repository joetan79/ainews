<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AI & Tech Daily{% endblock %}</title>

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="shortcut icon" href="/static/favicon.svg">
  <meta name="theme-color" content="#06B6D4">

  <!-- Open Graph -->
  <meta property="og:title" content="AI & Tech Daily">
  <meta property="og:description" content="Your daily AI & tech intelligence">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">


  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="/static/style.css?v=12" />

  <!-- Apply theme BEFORE render to prevent flash of wrong theme -->
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <style>
    /* ============================================
       LIGHT MODE (default)
       ============================================ */
    :root {
      --bg-primary:    #FFFFFF;
      --bg-secondary:  #F1F5F9;
      --bg-card:       #FFFFFF;
      --bg-navbar:     rgba(255,255,255,0.98);

      --text-primary:   #0A0A0A;
      --text-secondary: #1E293B;
      --text-muted:     #475569;
      --text-light:     #64748B;

      --border-color:   #CBD5E1;
      --card-shadow:    0 2px 8px rgba(0,0,0,0.10);

      --accent:         #0891B2;
      --accent-hover:   #0E7490;
      --accent-light:   #E0F2FE;
      --accent-text:    #0369A1;

      --badge-bg:       #E0F2FE;
      --badge-text:     #0369A1;

      --btn-primary-bg: #0891B2;
      --btn-primary-text: #FFFFFF;

      --input-bg:       #FFFFFF;
      --input-border:   #CBD5E1;
      --input-text:     #0A0A0A;
      --input-placeholder: #94A3B8;

      --hero-text:      #0A0A0A;
      --hero-sub:       #1E293B;
      --date-header:    #0A0A0A;
      --link-color:     #0891B2;
      --footer-bg:      #F8FAFC;
      --footer-text:    #475569;

      /* Legacy aliases */
      --border:         #CBD5E1;
      --text-dim:       #475569;
      --text-faint:     #64748B;
      --navbar-bg:      rgba(255,255,255,0.98);
      --accent-dark:    #0E7490;
    }

    /* ============================================
       DARK MODE
       ============================================ */
    [data-theme="dark"] {
      --bg-primary:    #0A0A0B;
      --bg-secondary:  #111116;
      --bg-card:       #16161A;
      --bg-navbar:     rgba(10,10,11,0.97);

      --text-primary:   #F8FAFC;
      --text-secondary: #CBD5E1;
      --text-muted:     #94A3B8;
      --text-light:     #64748B;

      --border-color:   #1E293B;
      --card-shadow:    0 2px 8px rgba(0,0,0,0.4);

      --accent:         #06B6D4;
      --accent-hover:   #22D3EE;
      --accent-light:   #164E63;
      --accent-text:    #06B6D4;

      --badge-bg:       #164E63;
      --badge-text:     #67E8F9;

      --btn-primary-bg: #06B6D4;
      --btn-primary-text: #0A0A0B;

      --input-bg:       #1E1E2E;
      --input-border:   #2D2D3E;
      --input-text:     #F8FAFC;
      --input-placeholder: #64748B;

      --hero-text:      #F8FAFC;
      --hero-sub:       #CBD5E1;
      --date-header:    #F8FAFC;
      --link-color:     #06B6D4;
      --footer-bg:      #111116;
      --footer-text:    #64748B;

      /* Legacy aliases */
      --border:         #1E293B;
      --text-dim:       #94A3B8;
      --text-faint:     #64748B;
      --navbar-bg:      rgba(10,10,11,0.97);
      --accent-dark:    #22D3EE;
    }

    /* ============================================
       GLOBAL STYLES
       ============================================ */
    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg-primary);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      animation: pageIn 0.25s ease both;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
      top: 0 !important;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Article cards: staggered fade-in */
    .article-card {
      opacity: 0;
      animation: cardIn 0.4s ease both;
    }
    .article-card:nth-child(1) { animation-delay: 0.04s; }
    .article-card:nth-child(2) { animation-delay: 0.09s; }
    .article-card:nth-child(3) { animation-delay: 0.14s; }
    .article-card:nth-child(4) { animation-delay: 0.19s; }
    .article-card:nth-child(5) { animation-delay: 0.24s; }
    .article-card:nth-child(6) { animation-delay: 0.29s; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============================================
       NAVBAR - Mobile First
       ============================================ */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: var(--bg-navbar);
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .navbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 16px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: relative;
    }

    .navbar-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .navbar-logo-text {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      line-height: 1.2;
    }

    .navbar-logo-badge {
      font-size: 10px;
      background: var(--badge-bg);
      color: var(--badge-text);
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 600;
      white-space: nowrap;
      display: none;
    }

    .navbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .theme-toggle-btn {
      height: 30px;
      padding: 6px 7px;
      border: none;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s;
      flex-shrink: 0;
      color: var(--text-primary);
    }
    .theme-toggle-btn:hover {
      opacity: 0.55;
    }
    .theme-toggle-btn svg {
      width: 16px;
      height: 16px;
      display: block;
      flex-shrink: 0;
    }

    /* CSS-driven icon swap — no JS needed */
    #theme-toggle .icon-sun  { display: block; }
    #theme-toggle .icon-moon { display: none; }
    [data-theme="dark"] #theme-toggle .icon-sun  { display: none; }
    [data-theme="dark"] #theme-toggle .icon-moon { display: block; }

    .translate-btn {
      height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .translate-btn:hover {
      background: var(--accent-light);
    }

    .translate-btn .translate-icon {
      font-size: 13px;
    }

    .translate-btn .translate-text {
      display: none;
    }

    .subscribe-nav-btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      text-decoration: none;
      display: flex;
      align-items: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .subscribe-nav-btn:hover {
      background: var(--accent-hover);
      color: white;
    }

    #translate-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      z-index: 99999;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      min-width: 200px;
      max-height: 70vh;
      overflow-y: auto;
      display: none;
    }

    body {
      padding-top: 52px;
    }

    /* Small mobile */
    @media (max-width: 380px) {
      .navbar-logo-text { font-size: 14px; }
      .subscribe-nav-btn { padding: 0 8px; font-size: 11px; }
      .translate-btn { padding: 0 8px; }
    }

    /* Medium mobile and up */
    @media (min-width: 480px) {
      .translate-btn .translate-text { display: inline; }
    }

    /* Tablet and up */
    @media (min-width: 640px) {
      .navbar-inner { height: 60px; padding: 0 24px; }
      .navbar-logo-text { font-size: 18px; }
      .navbar-logo-badge { display: inline; }
      .theme-toggle-btn { height: 32px; }
      .theme-toggle-btn svg { width: 17px; height: 17px; }
      .translate-btn { height: 38px; padding: 0 14px; font-size: 13px; }
      .subscribe-nav-btn { height: 38px; padding: 0 16px; font-size: 13px; }
      body { padding-top: 60px; }
    }

    /* Desktop */
    @media (min-width: 1024px) {
      .navbar-inner { height: 64px; gap: 12px; }
      .navbar-logo-text { font-size: 20px; }
      .navbar-actions { gap: 10px; }
      .theme-toggle-btn { height: 34px; }
      .theme-toggle-btn svg { width: 18px; height: 18px; }
      .translate-btn { height: 40px; padding: 0 16px; font-size: 14px; }
      .subscribe-nav-btn { height: 40px; padding: 0 20px; font-size: 14px; }
      body { padding-top: 64px; }
    }

    /* ============================================
       COMPONENT CLASSES
       ============================================ */

    /* Cards */
    .news-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, background 0.3s ease;
    }
    .news-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 0 1px rgba(6,182,212,0.25), 0 24px 48px rgba(0,0,0,0.55);
      border-color: rgba(6,182,212,0.25) !important;
    }

    /* Card title */
    .card-title {
      color: var(--text-primary) !important;
    }

    /* Card summary */
    .card-summary {
      color: var(--text-secondary) !important;
    }

    /* Card meta (date, source) */
    .card-meta {
      color: var(--text-muted) !important;
    }

    /* Category badge */
    .category-badge {
      background: var(--badge-bg) !important;
      color: var(--badge-text) !important;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 0.2rem 0.65rem;
      border-radius: 9999px;
      display: inline-block;
    }

    /* Read more link */
    .read-more {
      color: var(--accent) !important;
      font-weight: 600;
      text-decoration: none;
    }
    .read-more:hover {
      color: var(--accent-hover) !important;
    }

    /* Hero section */
    .hero-section {
      background: linear-gradient(135deg, #EFF6FF 0%, #F0FDFA 100%);
      padding: 40px 16px 48px;
    }
    [data-theme="dark"] .hero-section {
      background: linear-gradient(135deg, #0F172A 0%, #0A0A0B 100%);
    }
    @media (min-width: 640px) {
      .hero-section { padding: 60px 24px 72px; }
    }
    @media (min-width: 1024px) {
      .hero-section { padding: 80px 24px 96px; }
    }

    /* Hero title */
    .hero-title {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.2;
    }
    @media (min-width: 640px) {
      .hero-title { font-size: 42px; }
    }
    @media (min-width: 1024px) {
      .hero-title { font-size: 56px; }
    }

    /* News grid */
    .news-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 0 16px;
    }
    @media (min-width: 640px) {
      .news-grid {
        grid-template-columns: repeat(2, 1fr);
        padding: 0 24px;
        gap: 20px;
      }
    }
    @media (min-width: 1024px) {
      .news-grid {
        grid-template-columns: repeat(3, 1fr);
        max-width: 1200px;
        margin: 0 auto;
        gap: 24px;
      }
    }

    /* Article page */
    .article-container {
      background: var(--bg-card);
      box-shadow: var(--card-shadow);
    }

    .article-title {
      color: var(--text-primary) !important;
    }

    .article-body {
      color: var(--text-secondary) !important;
      line-height: 1.85;
      white-space: pre-wrap;
    }

    .article-meta {
      color: var(--text-muted) !important;
    }

    /* Subscribe button pulse */
    .subscribe-pulse {
      animation: pulseCyan 2.2s ease-in-out infinite;
    }
    .subscribe-pulse:hover {
      animation: none;
    }
    @keyframes pulseCyan {
      0%, 100% { box-shadow: 0 0 0 0 rgba(6,182,212,0.45); }
      50%       { box-shadow: 0 0 0 10px rgba(6,182,212,0); }
    }

    /* Gradient-border card (for subscribe section) */
    .grad-border-card {
      position: relative;
      background: var(--bg-card);
      border-radius: 1.25rem;
    }
    .grad-border-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(135deg, #06B6D4 0%, #0891B2 30%, #1E1E2E 60%, #1E1E2E 100%);
      z-index: -1;
    }

    /* Input focus */
    .dark-input:focus {
      outline: none;
      border-color: rgba(6,182,212,0.5) !important;
    }

    /* Spin animation */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }

    /* Dark mode translate dropdown */
    [data-theme="dark"] #translate-menu {
      background: #1E1E2E !important;
      border-color: #2D2D3E !important;
    }
    [data-theme="dark"] #lang-list div {
      color: #F8FAFC !important;
    }
    [data-theme="dark"] #lang-list div:hover {
      background: #2D2D3E !important;
    }

    /* Scrollbar dark mode */
    [data-theme="dark"] {
      scrollbar-color: #2D2D3E #0A0A0B;
    }

    .skiptranslate { display: none !important; }
  </style>
</head>
<body>

  <!-- Fixed Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">

      <!-- Logo -->
      <a href="/" class="navbar-logo">
        <span class="navbar-logo-text">AI &amp; Tech Daily</span>
        <span class="navbar-logo-badge">AI &amp; Tech</span>
      </a>

      <!-- Hamburger button (mobile only) -->
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu" onclick="toggleMobileMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Collapsible nav: links + actions -->
      <div class="nav-collapse" id="nav-collapse">

        <!-- Nav Links -->
        <div class="nav-links-group">
          <a href="/past-coverage" class="nav-link-item">Past Coverage</a>
          <a href="/x-updates" class="nav-link-item">AI Pulse &amp; Updates</a>
        </div>

        <!-- Actions -->
        <div class="navbar-actions">

          <!-- Language Switcher Dropdown -->
          <div id="lang-switcher">
            <select id="lang-select" onchange="setLang(this.value)" class="lang-select" translate="no">
              <option value="en"    translate="no">🌐 Language</option>
              <option value="en"    translate="no">English</option>
              <option value="zh-TW" translate="no">繁體中文</option>
              <option value="zh-CN" translate="no">简体中文</option>
              <option value="ms"    translate="no">Bahasa Melayu</option>
              <option value="ja"    translate="no">日本語</option>
              <option value="ko"    translate="no">한국어</option>
            </select>
          </div>

          <!-- Theme Toggle -->
          <button
            id="theme-toggle"
            class="theme-toggle-btn"
            onclick="toggleTheme()"
            title="Toggle dark/light mode"
            aria-label="Toggle dark/light mode">
            <!-- Sun: shown in light mode -->
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5"/>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <!-- Moon: shown in dark mode -->
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>

        </div>
      </div>
    </div>
  </nav>

  <script>
    function toggleMobileMenu() {
      var menu = document.getElementById('nav-collapse');
      var btn = document.getElementById('hamburger-btn');
      menu.classList.toggle('open');
      btn.classList.toggle('active');
    }
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.nav-link-item').forEach(function(link) {
        link.addEventListener('click', function() {
          document.getElementById('nav-collapse').classList.remove('open');
          document.getElementById('hamburger-btn').classList.remove('active');
        });
      });
    });
  </script>

  <!-- Page content -->
  <main style="flex: 1;">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer style="border-top: 1px solid var(--border); background: var(--bg-card); margin-top: 5rem;">
    <div style="max-width: 1280px; margin: 0 auto; padding: 2rem 1.5rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem;">
      <p style="font-family: 'DM Sans', sans-serif; font-size: 0.8125rem; color: var(--text-faint);">
        &copy; {{ now.year if now else '2026' }} AI &amp; Tech Daily. All rights reserved.
      </p>
      <p style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--footer-text); font-style: italic;">
        Powered by ABbot
      </p>
    </div>
  </footer>

  {% block scripts %}{% endblock %}

  <script>
    // ── Theme management ──
    function getTheme() {
      return localStorage.getItem('theme') || 'light';
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      var btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.title = theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
      }
    }

    function toggleTheme() {
      var current = getTheme();
      var next = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', next);
      applyTheme(next);
    }

    // Sync button icon with current theme on load
    applyTheme(getTheme());
  </script>

  <!-- 3-tier image fallback chain -->
  <script>
    function handleImgError(img, domain, icon) {
      if (domain) {
        var wrap = img.closest('.article-image-wrap, .article-hero-wrap');
        if (!wrap) { showIconFallback(img, icon); return; }
        var isHero = wrap.classList.contains('article-hero-wrap');
        var div = document.createElement('div');
        div.className = isHero
          ? 'article-hero-img article-hero-img--fallback'
          : 'article-thumb article-thumb--fallback';
        div.innerHTML = '<div class="sc-inner"><span class="sc-src">' + domain + '</span></div>';
        img.parentNode.replaceChild(div, img);
        return;
      }
      showIconFallback(img, icon);
    }

    function handleFaviconError(img, icon) {
      showIconFallback(img, icon);
    }

    function showIconFallback(img, icon) {
      var wrap = img.closest('.article-image-wrap, .article-hero-wrap');
      if (!wrap) return;
      var isHero = wrap.classList.contains('article-hero-wrap');
      var div = document.createElement('div');
      div.className = isHero
        ? 'article-hero-img article-hero-img--icon'
        : 'article-thumb article-thumb--icon';
      div.innerHTML = '<span class="category-icon' + (isHero ? ' category-icon--hero' : '') + '">'
        + (icon || '🌐') + '</span>';
      img.parentNode.replaceChild(div, img);
    }
  </script>

  <!-- Language Switcher — manual googtrans cookie implementation -->
  <div id="google_translate_element" style="display:none;"></div>

  <script>
    var TX_DOMAINS = [
      'abai.cloud', '.abai.cloud',
      'news.abai.cloud', '.news.abai.cloud',
      window.location.hostname, '.' + window.location.hostname,
      ''
    ];

    function clearGoogtrans() {
      TX_DOMAINS.forEach(function(d) {
        ['/', ''].forEach(function(p) {
          var base = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=' + (p || '/');
          document.cookie = d ? base + '; domain=' + d + ';' : base + ';';
        });
      });
    }

    function setLang(lang) {
      clearGoogtrans();
      if (lang !== 'en') {
        var value = '/en/' + lang;
        TX_DOMAINS.forEach(function(d) {
          ['/', ''].forEach(function(p) {
            var base = 'googtrans=' + value + '; path=' + (p || '/');
            document.cookie = d ? base + '; domain=' + d + ';' : base + ';';
          });
        });
      }
      window.location.reload();
    }

    function getActiveLang() {
      var cookies = document.cookie.split(';');
      for (var i = 0; i < cookies.length; i++) {
        var c = cookies[i].trim();
        if (c.indexOf('googtrans=') === 0) {
          var parts = c.substring('googtrans='.length).split('/');
          if (parts.length >= 3 && parts[2]) return parts[2];
        }
      }
      return 'en';
    }

    // Set dropdown to current active language on page load
    (function() {
      var active = getActiveLang();
      var sel = document.getElementById('lang-select');
      if (!sel) return;
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === active) { sel.selectedIndex = i; break; }
      }
    })();

    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        { pageLanguage: 'en', autoDisplay: false },
        'google_translate_element'
      );
    }
  </script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
